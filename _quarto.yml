project:
  type: website
  output-dir: _site
  resources:
    - assets/**

website:
  title: "Seokju Kang"
  description: "Seokju Kang's Personal Homepage"
  site-url: "https://seokju-kang.github.io"
  open-graph: true
  twitter-card: true
  # favicon: assets/favicon.png   # TODO: 파비콘 이미지를 넣은 뒤 주석 해제
  # google-analytics: "G-XXXXXXXXXX"   # TODO: GA를 쓰려면 본인 측정 ID로 교체
  search:
    location: navbar
    type: overlay
  navbar:
    pinned: true
    title: false
    left:
      - href: index.qmd
        text: Home
      - href: cv.qmd
        text: CV
  page-footer:
    left: "© {{YEAR}} Seokju Kang"   # 배포 시 GitHub Actions가 자동으로 현재 연도로 치환

format:
  html:
    theme:
      light: cosmo
      dark: cosmo
    css: styles.css
    toc: true
    respect-user-color-scheme: true
    smooth-scroll: true
    link-external-icon: true
    include-in-header:
      - assets/meta-description.html
    include-after-body:
      - assets/search-button-fallback.html
    date-format: "MMM D, YYYY"

execute:
  freeze: auto
